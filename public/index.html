<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eContract Risk Agent</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Contract PDF review</p>
        <h1 id="page-title">eContract Risk Agent</h1>
        <p class="lede">
          Upload a text-layer contract PDF and get a concise risk summary with clause-level flags.
        </p>
      </section>

      <section class="workspace" aria-label="Contract analysis">
        <form class="upload-panel" id="analyze-form">
          <div class="dropzone" id="dropzone">
            <input id="contract-file" name="contract" type="file" accept="application/pdf" required>
            <div>
              <p class="drop-title">Choose a PDF</p>
              <p class="drop-copy" id="file-label">or drop it here, up to 20 MB</p>
            </div>
          </div>

          <button class="primary-action" type="submit">
            <span>Analyze contract</span>
          </button>

          <p class="status" id="status" role="status">Ready.</p>
        </form>

        <section class="results" id="results" aria-live="polite">
          <div class="empty-state">
            <p class="empty-title">No report yet</p>
            <p class="empty-copy">Results will appear here after the pipeline finishes.</p>
          </div>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
